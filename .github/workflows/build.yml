name: Build IceGram APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Base Files
        run: |
          echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
          echo -e "pluginManagement { repositories { google() mavenCentral() gradlePluginPortal() } }\ninclude ':app'" > settings.gradle
          mkdir -p app
          echo -e "plugins { id 'com.android.application' }\nandroid { namespace 'com.icegram.app' compileSdk 34\n defaultConfig { applicationId 'com.icegram.app' minSdk 24 targetSdk 34 versionCode 1 versionName '1.0' } }" > app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
